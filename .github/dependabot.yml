version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps|github-actions)"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps|submodules)"
    labels:
      - "dependencies"
      - "submodules"
